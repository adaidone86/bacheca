<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <!-- Copertina fissa dei viaggi (0.7.0): aereo visto dal basso nel cielo -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="0.6" stop-color="#42a5f5"/>
      <stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.88" cy="0.12" r="0.45">
      <stop offset="0" stop-color="#fffde7" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#fff9c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b0bec5"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceff1"/>
      <stop offset="1" stop-color="#b0bec5"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="url(#sky)"/>
  <rect width="800" height="320" fill="url(#sun)"/>

  <!-- Nuvole -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="90" cy="285" rx="110" ry="30"/>
    <ellipse cx="170" cy="270" rx="70" ry="34"/>
    <ellipse cx="40" cy="262" rx="55" ry="26"/>
    <ellipse cx="640" cy="300" rx="130" ry="28"/>
    <ellipse cx="720" cy="282" rx="70" ry="30"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="300" cy="70" rx="60" ry="14"/>
    <ellipse cx="335" cy="60" rx="34" ry="14"/>
    <ellipse cx="560" cy="210" rx="50" ry="12"/>
  </g>

  <!-- Aereo visto dal basso, puntato in alto a destra -->
  <g transform="translate(440 165) rotate(52) scale(1.05)">
    <!-- Scie dei motori -->
    <rect x="-98" y="40" width="6" height="420" fill="url(#trail)"/>
    <rect x="-53" y="22" width="6" height="420" fill="url(#trail)"/>
    <rect x="47" y="22" width="6" height="420" fill="url(#trail)"/>
    <rect x="92" y="40" width="6" height="420" fill="url(#trail)"/>
    <!-- Ali -->
    <path d="M -12 -18 L -165 48 L -165 62 L -12 26 Z" fill="url(#wing)" stroke="#78909c" stroke-width="1.5"/>
    <path d="M 12 -18 L 165 48 L 165 62 L 12 26 Z" fill="url(#wing)" stroke="#78909c" stroke-width="1.5"/>
    <!-- Piani di coda -->
    <path d="M -9 92 L -58 118 L -58 126 L -9 112 Z" fill="url(#wing)" stroke="#78909c" stroke-width="1.5"/>
    <path d="M 9 92 L 58 118 L 58 126 L 9 112 Z" fill="url(#wing)" stroke="#78909c" stroke-width="1.5"/>
    <!-- Motori -->
    <rect x="-104" y="14" width="18" height="32" rx="8" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
    <rect x="-59" y="-4" width="18" height="32" rx="8" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
    <rect x="41" y="-4" width="18" height="32" rx="8" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
    <rect x="86" y="14" width="18" height="32" rx="8" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
    <!-- Fusoliera -->
    <path d="M 0 -128 C 12 -128 15 -105 15 -80 L 15 100 C 15 120 8 132 0 138 C -8 132 -15 120 -15 100 L -15 -80 C -15 -105 -12 -128 0 -128 Z" fill="url(#belly)" stroke="#78909c" stroke-width="1.5"/>
    <!-- Luci -->
    <circle cx="-163" cy="55" r="3" fill="#e53935"/>
    <circle cx="163" cy="55" r="3" fill="#43a047"/>
    <circle cx="0" cy="10" r="3" fill="#e53935"/>
  </g>
</svg>
