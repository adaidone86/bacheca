<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="errorContainer" class="error-container" style="display: none;">
        <div class="error-message">
            <h1>⚠️ Errore di configurazione</h1>
            <p>Il file di versione non è in un formato corretto.</p>
            <p>Formato richiesto: <strong>x.x.x</strong> (esempio: 0.0.1)</p>
        </div>
    </div>

    <div id="mainContainer" class="container">
        <header>
            <h1 id="titleLine1" style="cursor: pointer;"></h1>
            <h1 id="titleLine2" style="cursor: pointer;"></h1>
            <p class="subtitle" id="titleLine3"></p>
            <div class="header-buttons">
                <button id="viewToggleBtn" class="view-toggle">📋 Lista</button>
                <button id="settingsBtn">⚙️ Impostazioni</button>
                <button id="infoBtn">ℹ️ Info</button>
            </div>
        </header>

        <div id="listView" class="list-view" style="display: none;">
            <div id="eventsList" class="events-list"></div>
        </div>

        <div id="calendarView" class="calendar-wrapper">
            <div class="calendar-header">
                <button class="btn-nav" id="prevBtn">← Mese precedente</button>
                <div class="month-year" id="monthYear"></div>
                <button class="btn-nav" id="nextBtn">Mese successivo →</button>
                <button class="btn-today">Oggi</button>
            </div>

            <div class="weekdays">
                <div class="weekday">Lun</div>
                <div class="weekday">Mar</div>
                <div class="weekday">Mer</div>
                <div class="weekday">Gio</div>
                <div class="weekday">Ven</div>
                <div class="weekday">Sab</div>
                <div class="weekday">Dom</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>

        <footer>
            <p>🪫 Powerd By: adaidone - 🆚 0.0.1</p>
        </footer>
    </div>

    <!-- Modal per aggiungere nota -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Aggiungi un evento</div>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="evento-tab">📌 Evento</button>
                <button class="modal-tab" data-tab="participants-tab">👥 Partecipanti</button>
                <button class="modal-tab" data-tab="details-tab">📍 Dettagli</button>
            </div>
            <form id="noteForm">
                <!-- Tab: Evento -->
                <div id="evento-tab" class="modal-tab-content active">
                    <div class="form-group">
                        <label for="eventTitle">📌 Nome evento</label>
                        <input type="text" id="eventTitle" placeholder="Es: SAGRA DEL TORTELLO" required>
                    </div>

                    <div class="form-group">
                        <label for="eventTime">🕐 Ora</label>
                        <input type="time" id="eventTime" required>
                    </div>

                    <div class="form-group">
                        <label for="eventLocation">📍 Luogo</label>
                        <input type="text" id="eventLocation" placeholder="Es: O.Live – Parco dell'Oliveta (Sesto)" required>
                    </div>

                    <div class="form-group">
                        <label for="eventNotes">📝 Note aggiuntive</label>
                        <textarea id="eventNotes" placeholder="Es: con cena cantata! 📞 Prenotazione: 393 336 4633" required></textarea>
                    </div>
                </div>

                <!-- Tab: Partecipanti -->
                <div id="participants-tab" class="modal-tab-content">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="eventHasParticipants">
                            👥 Aggiungi partecipanti
                        </label>
                    </div>

                    <div class="form-group" id="eventParticipantsGroup" style="display: none;">
                        <div id="eventParticipantsList" class="participants-list"></div>

                        <div class="participants-input-group" id="eventParticipantsInputGroup" style="display: none;">
                            <input type="text" id="eventParticipantInput" placeholder="Nome partecipante" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px;">
                            <button type="button" class="btn-participant-save" id="eventParticipantSaveBtn" style="padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 8px;">Salva</button>
                        </div>

                        <button type="button" class="btn-add-participant" id="eventAddParticipantBtn" style="width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px;">+ Aggiungi partecipante</button>
                    </div>
                </div>

                <!-- Tab: Dettagli -->
                <div id="details-tab" class="modal-tab-content">
                    <div class="form-group">
                        <label>🎨 Categoria evento</label>
                        <div class="color-filter-group">
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-neutral" checked>
                                <span class="color-filter-label" style="background: #999; color: white;">⚪ Senza categoria</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-yellow">
                                <span class="color-filter-label" style="background: #ffd54f; color: #333;">🍽️ Gastronomia/Cibo</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-pink">
                                <span class="color-filter-label" style="background: #ff6b9d; color: white;">👥 Serate/Sociali</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-green">
                                <span class="color-filter-label" style="background: #81c784; color: white;">⛹️ Sport/Attività</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-blue">
                                <span class="color-filter-label" style="background: #64b5f6; color: white;">🎮 Intrattenimento</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-purple">
                                <span class="color-filter-label" style="background: #ba68c8; color: white;">🎵 Cultura/Musica</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="eventColor" class="color-select" data-color="color-orange">
                                <span class="color-filter-label" style="background: #ffb74d; color: white;">🏞️ Escursioni/Turismo</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="eventLink">🔗 Link</label>
                        <input type="url" id="eventLink" placeholder="Es: https://example.com">
                    </div>

                    <div class="form-group">
                        <label for="eventImage">🖼️ Immagine</label>
                        <input type="file" id="eventImage" accept="image/*">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Aggiungi</button>
                    <button type="button" class="btn-cancel" id="closeBtn">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">⚙️ Impostazioni</div>
            <p class="settings-subtitle">Filtra eventi per colore</p>

            <div class="settings-input-group">
                <label>🎨 Categorie di Eventi</label>
                <div class="color-filter-group">
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-neutral" checked>
                        <span class="color-filter-label" style="background: #999; color: white;">⚪ Senza categoria</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-yellow" checked>
                        <span class="color-filter-label" style="background: #ffd54f; color: #333;">🍽️ Gastronomia/Cibo</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-pink" checked>
                        <span class="color-filter-label" style="background: #ff6b9d; color: white;">👥 Serate/Sociali</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-green" checked>
                        <span class="color-filter-label" style="background: #81c784; color: white;">⛹️ Sport/Attività</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-blue" checked>
                        <span class="color-filter-label" style="background: #64b5f6; color: white;">🎮 Intrattenimento</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-purple" checked>
                        <span class="color-filter-label" style="background: #ba68c8; color: white;">🎵 Cultura/Musica</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-orange" checked>
                        <span class="color-filter-label" style="background: #ffb74d; color: white;">🏞️ Escursioni/Turismo</span>
                    </label>
                </div>
            </div>

            <div class="settings-buttons">
                <button type="button" class="btn-settings-cancel" id="closeSettingsBtn" style="width: 100%;">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="info-modal" id="infoModal">
        <div class="info-content">
            <div class="info-header">ℹ️ Informazioni</div>
            <div class="info-body" id="infoBody"></div>
            <div class="info-buttons">
                <button type="button" class="btn-info-close" id="closeInfoBtn">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- GIF Modal -->
    <div class="gif-modal" id="gifModal">
        <div class="gif-container">
            <img src="immagini/tenor.gif" alt="Reazione gif">
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">✏️ Modifica evento</div>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="edit-evento-tab">📌 Evento</button>
                <button class="modal-tab" data-tab="edit-participants-tab">👥 Partecipanti</button>
                <button class="modal-tab" data-tab="edit-details-tab">📍 Dettagli</button>
            </div>
            <form id="editForm">
                <!-- Tab: Evento -->
                <div id="edit-evento-tab" class="modal-tab-content active">
                    <div class="form-group">
                        <label for="editTitle">📌 Nome evento</label>
                        <input type="text" id="editTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="editTime">🕐 Ora</label>
                        <input type="time" id="editTime">
                    </div>

                    <div class="form-group">
                        <label for="editLocation">📍 Luogo</label>
                        <input type="text" id="editLocation">
                    </div>

                    <div class="form-group">
                        <label for="editNotes">📝 Note aggiuntive</label>
                        <textarea id="editNotes"></textarea>
                    </div>
                </div>

                <!-- Tab: Partecipanti -->
                <div id="edit-participants-tab" class="modal-tab-content">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="editHasParticipants">
                            👥 Aggiungi partecipanti
                        </label>
                    </div>

                    <div class="form-group" id="editParticipantsGroup" style="display: none;">
                        <div id="editParticipantsList" class="participants-list"></div>

                        <div class="participants-input-group" id="editParticipantsInputGroup" style="display: none;">
                            <input type="text" id="editParticipantInput" placeholder="Nome partecipante" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px;">
                            <button type="button" class="btn-participant-save" id="editParticipantSaveBtn" style="padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 8px;">Salva</button>
                        </div>

                        <button type="button" class="btn-add-participant" id="editAddParticipantBtn" style="width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px;">+ Aggiungi partecipante</button>
                    </div>
                </div>

                <!-- Tab: Dettagli -->
                <div id="edit-details-tab" class="modal-tab-content">
                    <div class="form-group">
                        <label>🎨 Categoria evento</label>
                        <div class="color-filter-group">
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-neutral">
                                <span class="color-filter-label" style="background: #999; color: white;">⚪ Senza categoria</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-yellow">
                                <span class="color-filter-label" style="background: #ffd54f; color: #333;">🍽️ Gastronomia/Cibo</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-pink">
                                <span class="color-filter-label" style="background: #ff6b9d; color: white;">👥 Serate/Sociali</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-green">
                                <span class="color-filter-label" style="background: #81c784; color: white;">⛹️ Sport/Attività</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-blue">
                                <span class="color-filter-label" style="background: #64b5f6; color: white;">🎮 Intrattenimento</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-purple">
                                <span class="color-filter-label" style="background: #ba68c8; color: white;">🎵 Cultura/Musica</span>
                            </label>
                            <label class="color-radio">
                                <input type="radio" name="editEventColor" class="edit-color-select" data-color="color-orange">
                                <span class="color-filter-label" style="background: #ffb74d; color: white;">🏞️ Escursioni/Turismo</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editLink">🔗 Link</label>
                        <input type="url" id="editLink" placeholder="Es: https://example.com">
                    </div>

                    <div class="form-group">
                        <label for="editImage">🖼️ Immagine</label>
                        <input type="file" id="editImage" accept="image/*">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-save" id="saveEditBtn">Salva</button>
                    <button type="button" class="btn-cancel" id="deleteNoteBtn" style="background: #ff6b9d; color: white;">🗑️ Elimina</button>
                    <button type="button" class="btn-cancel" id="closeEditBtn">Chiudi</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
