<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca Collaborativa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="errorContainer" class="error-container" style="display: none;">
        <div class="error-message">
            <h1>⚠️ Errore di configurazione</h1>
            <p>Il file di versione non è in un formato corretto.</p>
            <p>Formato richiesto: <strong>x.x.x</strong> (esempio: 0.0.1)</p>
        </div>
    </div>

    <div id="mainContainer" class="container">
        <header>
            <h1 id="titleHeader" style="cursor: pointer;"></h1>
            <p class="subtitle" id="subtitleHeader"></p>
            <div class="header-buttons">
                <button id="viewToggleBtn" class="view-toggle">📋 Lista</button>
                <button id="settingsBtn">⚙️ Impostazioni</button>
                <button id="infoBtn">ℹ️ Info</button>
            </div>
        </header>

        <div id="listView" class="list-view" style="display: none;">
            <div id="eventsList" class="events-list"></div>
        </div>

        <div id="calendarView" class="calendar-wrapper">
            <div class="calendar-header">
                <button class="btn-nav" id="prevBtn">← Mese precedente</button>
                <div class="month-year" id="monthYear"></div>
                <button class="btn-nav" id="nextBtn">Mese successivo →</button>
                <button class="btn-today">Oggi</button>
            </div>

            <div class="weekdays">
                <div class="weekday">Lun</div>
                <div class="weekday">Mar</div>
                <div class="weekday">Mer</div>
                <div class="weekday">Gio</div>
                <div class="weekday">Ven</div>
                <div class="weekday">Sab</div>
                <div class="weekday">Dom</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>

        <footer>
            <p>🪫 Powerd By: adaidone - 🆚 0.0.1</p>
        </footer>
    </div>

    <!-- Modal per aggiungere nota -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Aggiungi un evento</div>
            <form id="noteForm">
                <div class="form-group">
                    <label for="eventTitle">📌 Nome evento</label>
                    <input type="text" id="eventTitle" placeholder="Es: SAGRA DEL TORTELLO" required>
                </div>

                <div class="form-group">
                    <label for="eventTime">🕐 Ora</label>
                    <input type="text" id="eventTime" placeholder="Es: 19:00-23:00">
                </div>

                <div class="form-group">
                    <label for="eventLocation">📍 Luogo</label>
                    <input type="text" id="eventLocation" placeholder="Es: O.Live – Parco dell'Oliveta (Sesto)">
                </div>

                <div class="form-group">
                    <label for="eventNotes">📝 Note aggiuntive</label>
                    <textarea id="eventNotes" placeholder="Es: con cena cantata! 📞 Prenotazione: 393 336 4633"></textarea>
                </div>

                <div class="form-group">
                    <label>🎨 Colore</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option color-yellow selected" data-color="color-yellow"></div>
                        <div class="color-option color-pink" data-color="color-pink"></div>
                        <div class="color-option color-green" data-color="color-green"></div>
                        <div class="color-option color-blue" data-color="color-blue"></div>
                        <div class="color-option color-purple" data-color="color-purple"></div>
                        <div class="color-option color-orange" data-color="color-orange"></div>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Aggiungi</button>
                    <button type="button" class="btn-cancel" id="closeBtn">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">⚙️ Impostazioni</div>
            <p class="settings-subtitle">Filtra eventi per colore</p>

            <div class="settings-input-group">
                <label>🎨 Categorie di Eventi</label>
                <div class="color-filter-group">
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-yellow" checked>
                        <span class="color-filter-label" style="background: #ffd54f; color: #333;">🍽️ Gastronomia/Cibo</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-pink" checked>
                        <span class="color-filter-label" style="background: #ff6b9d; color: white;">👥 Serate/Sociali</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-green" checked>
                        <span class="color-filter-label" style="background: #81c784; color: white;">⛹️ Sport/Attività</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-blue" checked>
                        <span class="color-filter-label" style="background: #64b5f6; color: white;">🎮 Intrattenimento</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-purple" checked>
                        <span class="color-filter-label" style="background: #ba68c8; color: white;">🎵 Cultura/Musica</span>
                    </label>
                    <label class="color-checkbox">
                        <input type="checkbox" class="color-filter" data-color="color-orange" checked>
                        <span class="color-filter-label" style="background: #ffb74d; color: white;">🏞️ Escursioni/Turismo</span>
                    </label>
                </div>
            </div>

            <div class="settings-buttons">
                <button type="button" class="btn-settings-cancel" id="closeSettingsBtn" style="width: 100%;">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="info-modal" id="infoModal">
        <div class="info-content">
            <div class="info-header">ℹ️ Informazioni</div>
            <div class="info-body" id="infoBody"></div>
            <div class="info-buttons">
                <button type="button" class="btn-info-close" id="closeInfoBtn">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- GIF Modal -->
    <div class="gif-modal" id="gifModal">
        <div class="gif-container">
            <img src="immagini/tenor.gif" alt="Reazione gif">
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">✏️ Modifica evento</div>
            <form id="editForm">
                <div class="form-group">
                    <label for="editTitle">📌 Nome evento</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="form-group">
                    <label for="editTime">🕐 Ora</label>
                    <input type="text" id="editTime">
                </div>

                <div class="form-group">
                    <label for="editLocation">📍 Luogo</label>
                    <input type="text" id="editLocation">
                </div>

                <div class="form-group">
                    <label for="editNotes">📝 Note aggiuntive</label>
                    <textarea id="editNotes"></textarea>
                </div>

                <div class="form-group">
                    <label>🎨 Colore</label>
                    <div class="color-picker" id="editColorPicker">
                        <div class="edit-color-option color-yellow selected" data-color="color-yellow"></div>
                        <div class="edit-color-option color-pink" data-color="color-pink"></div>
                        <div class="edit-color-option color-green" data-color="color-green"></div>
                        <div class="edit-color-option color-blue" data-color="color-blue"></div>
                        <div class="edit-color-option color-purple" data-color="color-purple"></div>
                        <div class="edit-color-option color-orange" data-color="color-orange"></div>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-save" id="saveEditBtn">Salva</button>
                    <button type="button" class="btn-cancel" id="deleteNoteBtn" style="background: #ff6b9d; color: white;">🗑️ Elimina</button>
                    <button type="button" class="btn-cancel" id="closeEditBtn">Chiudi</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
